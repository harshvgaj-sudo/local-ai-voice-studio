<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Local AI Voice Studio - free offline AI voice generator for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="55%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="160" r="230" fill="url(#glow)"/>

  <!-- thin accent rule down the left edge -->
  <rect x="0" y="0" width="6" height="320" fill="url(#bars)"/>

  <!-- title -->
  <text x="64" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    Local AI Voice Studio
  </text>

  <!-- tagline -->
  <text x="64" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#93a4bd">
    Free offline AI voice generator for Windows
  </text>

  <!-- feature chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="188" width="104" height="34" rx="17" fill="#16233c" stroke="#2b3d5e"/>
    <text x="116" y="210" fill="#7dd3a0" text-anchor="middle">No GPU</text>

    <rect x="180" y="188" width="126" height="34" rx="17" fill="#16233c" stroke="#2b3d5e"/>
    <text x="243" y="210" fill="#7dd3a0" text-anchor="middle">No API key</text>

    <rect x="318" y="188" width="140" height="34" rx="17" fill="#16233c" stroke="#2b3d5e"/>
    <text x="388" y="210" fill="#7dd3a0" text-anchor="middle">100% offline</text>

    <rect x="470" y="188" width="118" height="34" rx="17" fill="#16233c" stroke="#2b3d5e"/>
    <text x="529" y="210" fill="#7dd3a0" text-anchor="middle">Unlimited</text>

    <rect x="600" y="188" width="150" height="34" rx="17" fill="#16233c" stroke="#2b3d5e"/>
    <text x="675" y="210" fill="#7dd3a0" text-anchor="middle">No subscription</text>
  </g>

  <!-- engine note -->
  <text x="64" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" fill="#6b7d99">
    Powered by Kokoro-82M &#183; 24 kHz WAV &#183; one-click installer
  </text>

  <!-- waveform -->
  <g fill="url(#bars)">
    <rect x="760"  y="141" width="8" height="38"  rx="4"/>
    <rect x="776"  y="129" width="8" height="62"  rx="4"/>
    <rect x="792"  y="115" width="8" height="90"  rx="4"/>
    <rect x="808"  y="100" width="8" height="120" rx="4"/>
    <rect x="824"  y="118" width="8" height="84"  rx="4"/>
    <rect x="840"  y="132" width="8" height="56"  rx="4"/>
    <rect x="856"  y="108" width="8" height="104" rx="4"/>
    <rect x="872"  y="91"  width="8" height="138" rx="4"/>
    <rect x="888"  y="112" width="8" height="96"  rx="4"/>
    <rect x="904"  y="128" width="8" height="64"  rx="4"/>
    <rect x="920"  y="138" width="8" height="44"  rx="4"/>
    <rect x="936"  y="122" width="8" height="76"  rx="4"/>
    <rect x="952"  y="101" width="8" height="118" rx="4"/>
    <rect x="968"  y="87"  width="8" height="146" rx="4"/>
    <rect x="984"  y="104" width="8" height="112" rx="4"/>
    <rect x="1000" y="120" width="8" height="80"  rx="4"/>
    <rect x="1016" y="134" width="8" height="52"  rx="4"/>
    <rect x="1032" y="114" width="8" height="92"  rx="4"/>
    <rect x="1048" y="96"  width="8" height="128" rx="4"/>
    <rect x="1064" y="110" width="8" height="100" rx="4"/>
    <rect x="1080" y="125" width="8" height="70"  rx="4"/>
    <rect x="1096" y="136" width="8" height="48"  rx="4"/>
    <rect x="1112" y="117" width="8" height="86"  rx="4"/>
    <rect x="1128" y="102" width="8" height="116" rx="4"/>
    <rect x="1144" y="123" width="8" height="74"  rx="4"/>
    <rect x="1160" y="133" width="8" height="54"  rx="4"/>
  </g>
</svg>
